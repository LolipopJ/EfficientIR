[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
  "E",  # pycodestyle errors
  "W",  # pycodestyle warnings
  "F",  # pyflakes
  "I",  # isort
  "UP", # pyupgrade
]

[tool.ruff.lint.per-file-ignores]
"opti.py" = ["F401"] # onnx optimizer import may appear unused

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
